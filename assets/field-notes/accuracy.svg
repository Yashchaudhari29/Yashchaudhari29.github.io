pam recall is 0 out of 5: zero percent.</text><text x="622" y="391" font-size="22" ></text><text x="622" y="425" font-size="22" >Inspect the confusion matrix and choose</text><text x="622" y="459" font-size="22" >metrics around the cost of mistakes.</text><path d="M624 494 Q820 484 1040 497" stroke="#75895c" fill="none"/><text x="622" y="541" font-size="20" font-style="italic" fill="#5d704d">Ask: which mistakes matter most?</text><text x="622" y="582" font-size="12" letter-spacing="2">CONCEPT NOTES · SEPTEMBER 2026</text><text x="58" y="639" font-size="15" >03</text><text x="1035" y="639" font-size="15" >04</text></g></svg>