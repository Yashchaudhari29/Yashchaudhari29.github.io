<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680"><defs><linearGradient id="paper"><stop stop-color="#e4dcc8"/><stop offset=".08" stop-color="#f4eedf"/><stop offset=".46" stop-color="#f0e8d7"/><stop offset=".5" stop-color="#c9bca4"/><stop offset=".54" stop-color="#eee6d4"/><stop offset=".93" stop-color="#f7f0df"/><stop offset="1" stop-color="#e5dac3"/></linearGradient><pattern id="grain" width="13" height="17" patternUnits="userSpaceOnUse"><circle cx="2" cy="4" r=".7" fill="#766851" opacity=".13"/><circle cx="9" cy="12" r=".5" fill="#fff" opacity=".55"/></pattern></defs><rect x="2" y="5" width="1116" height="672" rx="8" fill="url(#paper)"/><rect x="2" y="5" width="1116" height="672" fill="url(#grain)"/><path d="M560 14 Q549 330 560 666" stroke="#8e7f66" opacity=".4" fill="none"/><g font-family="Georgia,serif" fill="#363a2e"><text x="58" y="62" font-size="13" letter-spacing="3">YASH / FIELD NOTES</text><text x="622" y="62" font-size="13" letter-spacing="2">03 / WEB PERFORMANCE</text><rect x="110" y="120" width="235" height="53" rx="4" fill="#b6cbb6" fill-opacity=".6" stroke="#687861"/><text x="130" y="155" font-size="25" >Fetch</text><path d="M230 178 l0 13 l40 0" fill="none" stroke="#6a705d" stroke-width="2"/><rect x="190" y="198" width="235" height="53" rx="4" fill="#decfb3" fill-opacity=".6" stroke="#687861"/><text x="210" y="233" font-size="25" >Parse</text><path d="M310 256 l0 13 l-40 0" fill="none" stroke="#6a705d" stroke-width="2"/><rect x="110" y="276" width="235" height="53" rx="4" fill="#b6cbb6" fill-opacity=".6" stroke="#687861"/><text x="130" y="311" font-size="25" >Layout</text><path d="M230 334 l0 13 l40 0" fill="none" stroke="#6a705d" stroke-width="2"/><rect x="190" y="354" width="235" height="53" rx="4" fill="#decfb3" fill-opacity=".6" stroke="#687861"/><text x="210" y="389" font-size="25" >Paint</text><path d="M310 412 l0 13 l-40 0" fill="none" stroke="#6a705d" stroke-width="2"/><rect x="110" y="432" width="235" height="53" rx="4" fill="#b6cbb6" fill-opacity=".6" stroke="#687861"/><text x="130" y="467" font-size="25" >Composite</text><text x="75" y="584" font-size="21" font-style="italic" fill="#546849">Loading is only part of the journey.</text><text x="622" y="127" font-size="35" >From bytes to pixels</text><text x="622" y="187" font-size="22" >The browser fetches resources, parses</text><text x="622" y="221" font-size="22" >HTML and CSS, then works out the layout.</text><text x="622" y="255" font-size="22" >Painting draws the pieces; compositing</text><text x="622" y="289" font-size="22" >combines layers into the final screen.</text><text x="622" y="323" font-size="22" ></text><text x="622" y="357" font-size="22" >Large downloads delay arrival. Long</text><text x="622" y="391" font-size="22" >JavaScript tasks can delay interaction.</text><text x="622" y="425" font-size="22" >Measure both loading and responsiveness</text><text x="622" y="459" font-size="22" >before deciding what to optimize.</text><path d="M624 494 Q820 484 1040 497" stroke="#75895c" fill="none"/><text x="622" y="541" font-size="20" font-style="italic" fill="#5d704d">Fast delivery still needs a smooth landing.</text><text x="622" y="582" font-size="12" letter-spacing="2">CONCEPT NOTES · SEPTEMBER 2026</text><text x="58" y="639" font-size="15" >05</text><text x="1035" y="639" font-size="15" >06</text></g></svg>