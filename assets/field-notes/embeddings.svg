<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680"><defs><linearGradient id="paper"><stop stop-color="#e4dcc8"/><stop offset=".08" stop-color="#f4eedf"/><stop offset=".46" stop-color="#f0e8d7"/><stop offset=".5" stop-color="#c9bca4"/><stop offset=".54" stop-color="#eee6d4"/><stop offset=".93" stop-color="#f7f0df"/><stop offset="1" stop-color="#e5dac3"/></linearGradient><pattern id="grain" width="13" height="17" patternUnits="userSpaceOnUse"><circle cx="2" cy="4" r=".7" fill="#766851" opacity=".13"/><circle cx="9" cy="12" r=".5" fill="#fff" opacity=".55"/></pattern></defs><rect x="2" y="5" width="1116" height="672" rx="8" fill="url(#paper)"/><rect x="2" y="5" width="1116" height="672" fill="url(#grain)"/><path d="M560 14 Q549 330 560 666" stroke="#8e7f66" opacity=".4" fill="none"/><g font-family="Georgia,serif" fill="#363a2e"><text x="58" y="62" font-size="13" letter-spacing="3">YASH / FIELD NOTES</text><text x="622" y="62" font-size="13" letter-spacing="2">01 / REPRESENTATION</text><ellipse cx="240" cy="305" rx="170" ry="125" fill="#91b29b" opacity=".2" transform="rotate(-20 240 305)"/><path d="M85 440 L85 170 M85 440 L440 440" fill="none" stroke="#736856" stroke-width="2"/><path d="M112 360 Q220 260 360 245" fill="none" stroke="#487761" stroke-dasharray="5 8"/><circle cx="150" cy="330" r="7" fill="#38674d"/><text x="162" y="318" font-size="24" >cat</text><circle cx="235" cy="280" r="7" fill="#38674d"/><text x="247" y="268" font-size="24" >dog</text><circle cx="295" cy="345" r="7" fill="#38674d"/><text x="307" y="333" font-size="24" >wolf</text><circle cx="370" cy="190" r="7" fill="#38674d"/><text x="382" y="178" font-size="24" >bicycle</text><text x="103" y="493" font-size="16" >2D illustration of a higher-dimensional space</text><text x="75" y="584" font-size="21" font-style="italic" fill="#546849">Nearby ideas, nearby coordinates.</text><text x="622" y="127" font-size="35" >A map of meaning</text><text x="622" y="187" font-size="22" >An embedding represents an item as a</text><text x="622" y="221" font-size="22" >list of learned numbers. Related items</text><text x="622" y="255" font-size="22" >can occupy nearby places in that space.</text><text x="622" y="289" font-size="22" ></text><text x="622" y="323" font-size="22" >For search, compare a query vector</text><text x="622" y="357" font-size="22" >with document vectors to find candidates.</text><text x="622" y="391" font-size="22" >Similarity helps retrieval; it does not</text><text x="622" y="425" font-size="22" >prove that an answer is true.</text><path d="M624 494 Q820 484 1040 497" stroke="#75895c" fill="none"/><text x="622" y="541" font-size="20" font-style="italic" fill="#5d704d">A map is a model, not the territory.</text><text x="622" y="582" font-size="12" letter-spacing="2">CONCEPT NOTES · SEPTEMBER 2026</text><text x="58" y="639" font-size="15" >01</text><text x="1035" y="639" font-size="15" >02</text></g></svg>