<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680"><defs><linearGradient id="paper"><stop stop-color="#111b19"/><stop offset=".08" stop-color="#202e29"/><stop offset=".46" stop-color="#1c2925"/><stop offset=".5" stop-color="#090f0d"/><stop offset=".54" stop-color="#1c2925"/><stop offset=".93" stop-color="#25332d"/><stop offset="1" stop-color="#14201a"/></linearGradient><pattern id="grain" width="13" height="17" patternUnits="userSpaceOnUse"><circle cx="2" cy="4" r=".7" fill="#89a295" opacity=".13"/><circle cx="9" cy="12" r=".5" fill="#fff" opacity=".06"/></pattern></defs><rect x="2" y="5" width="1116" height="672" rx="8" fill="url(#paper)"/><rect x="2" y="5" width="1116" height="672" fill="url(#grain)"/><path d="M560 14 Q549 330 560 666" stroke="#526955" opacity=".4" fill="none"/><g font-family="Georgia,serif" fill="#e1e7dc"><text x="58" y="62" font-size="13" letter-spacing="3">YASH / FIELD NOTES</text><text x="622" y="62" font-size="11" letter-spacing="2">05 / MIXTURE OF EXPERTS</text><text x="180" y="151" font-size="30" >Router</text><path d="M240 180 L110 280 M240 180 L240 280 M240 180 L380 280" stroke="#7bb891" fill="none"/><rect x="65" y="280" width="90" height="90" rx="7" fill="#3f7658" stroke="#829b89"/><text x="93" y="332" font-size="25" >E1</text><rect x="195" y="280" width="90" height="90" rx="7" fill="#232d29" stroke="#829b89"/><text x="223" y="332" font-size="25" >E2</text><rect x="335" y="280" width="90" height="90" rx="7" fill="#3f7658" stroke="#829b89"/><text x="363" y="332" font-size="25" >E3</text><path d="M110 375 L240 455 M380 375 L240 455" stroke="#7bb891" fill="none"/><text x="134" y="496" font-size="25" >Weighted combination</text><text x="160" y="540" font-size="16" >Two selected in this example</text><text x="75" y="584" font-size="21" font-style="italic" fill="#a3b89a">A router selects a subset of the available work.</text><text x="622" y="127" font-size="32" >Choose which experts run</text><text x="622" y="187" font-size="22" >A sparse MoE layer has several expert</text><text x="622" y="221" font-size="22" >networks and a learned router. Each</text><text x="622" y="255" font-size="22" >token is sent to a selected subset.</text><text x="622" y="289" font-size="22" ></text><text x="622" y="323" font-size="22" >This grows model capacity without</text><text x="622" y="357" font-size="22" >running every expert for every token.</text><text x="622" y="391" font-size="22" >Uneven routing can overload experts;</text><text x="622" y="425" font-size="22" >balancing and communication matter.</text><text x="622" y="459" font-size="22" >Total size is not active compute.</text><path d="M624 494 Q820 484 1040 497" stroke="#75895c" fill="none"/><text x="622" y="541" font-size="18" font-style="italic" fill="#b4c9a4">An “expert” is a network, not a named profession.</text><text x="622" y="582" font-size="12" letter-spacing="2">CONCEPT NOTES · SEPTEMBER 2026</text><text x="58" y="639" font-size="15" >09</text><text x="1035" y="639" font-size="15" >10</text></g></svg>