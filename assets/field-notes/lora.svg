<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680"><defs><linearGradient id="paper"><stop stop-color="#111b19"/><stop offset=".08" stop-color="#202e29"/><stop offset=".46" stop-color="#1c2925"/><stop offset=".5" stop-color="#090f0d"/><stop offset=".54" stop-color="#1c2925"/><stop offset=".93" stop-color="#25332d"/><stop offset="1" stop-color="#14201a"/></linearGradient><pattern id="grain" width="13" height="17" patternUnits="userSpaceOnUse"><circle cx="2" cy="4" r=".7" fill="#89a295" opacity=".13"/><circle cx="9" cy="12" r=".5" fill="#fff" opacity=".06"/></pattern></defs><rect x="2" y="5" width="1116" height="672" rx="8" fill="url(#paper)"/><rect x="2" y="5" width="1116" height="672" fill="url(#grain)"/><path d="M560 14 Q549 330 560 666" stroke="#526955" opacity=".4" fill="none"/><g font-family="Georgia,serif" fill="#e1e7dc"><text x="58" y="62" font-size="13" letter-spacing="3">YASH / FIELD NOTES</text><text x="622" y="62" font-size="11" letter-spacing="2">03 / LOW-RANK ADAPTATION</text><text x="112" y="134" font-size="38" >W  +  B × A</text><rect x="95" y="200" width="170" height="220" fill="#28332f" stroke="#8c9c92"/><rect x="315" y="200" width="35" height="220" fill="#5d9b79"/><rect x="370" y="200" width="135" height="35" fill="#5d9b79"/><text x="110" y="463" font-size="22" >frozen</text><text x="314" y="463" font-size="22" >trainable</text><text x="102" y="510" font-size="26" >rank r ≪ min(d, k)</text><text x="75" y="584" font-size="21" font-style="italic" fill="#a3b89a">Keep the base weights. Learn a smaller change.</text><text x="622" y="127" font-size="32" >Train the small update</text><text x="622" y="187" font-size="22" >Fine-tuning every weight is expensive.</text><text x="622" y="221" font-size="22" >LoRA freezes the base matrix W and</text><text x="622" y="255" font-size="22" >learns an update through two smaller</text><text x="622" y="289" font-size="22" >matrices: ΔW = BA.</text><text x="622" y="323" font-size="22" ></text><text x="622" y="357" font-size="22" >A small rank cuts trainable parameters</text><text x="622" y="391" font-size="22" >and optimizer storage. It is a capacity</text><text x="622" y="425" font-size="22" >choice, not a free quality guarantee.</text><text x="622" y="459" font-size="22" >Choose it against a held-out task.</text><path d="M624 494 Q820 484 1040 497" stroke="#75895c" fill="none"/><text x="622" y="541" font-size="18" font-style="italic" fill="#b4c9a4">Fewer trained weights; the base still takes memory.</text><text x="622" y="582" font-size="12" letter-spacing="2">CONCEPT NOTES · SEPTEMBER 2026</text><text x="58" y="639" font-size="15" >05</text><text x="1035" y="639" font-size="15" >06</text></g></svg>