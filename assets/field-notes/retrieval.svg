<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680"><defs><linearGradient id="paper"><stop stop-color="#111b19"/><stop offset=".08" stop-color="#202e29"/><stop offset=".46" stop-color="#1c2925"/><stop offset=".5" stop-color="#090f0d"/><stop offset=".54" stop-color="#1c2925"/><stop offset=".93" stop-color="#25332d"/><stop offset="1" stop-color="#14201a"/></linearGradient><pattern id="grain" width="13" height="17" patternUnits="userSpaceOnUse"><circle cx="2" cy="4" r=".7" fill="#89a295" opacity=".13"/><circle cx="9" cy="12" r=".5" fill="#fff" opacity=".06"/></pattern></defs><rect x="2" y="5" width="1116" height="672" rx="8" fill="url(#paper)"/><rect x="2" y="5" width="1116" height="672" fill="url(#grain)"/><path d="M560 14 Q549 330 560 666" stroke="#526955" opacity=".4" fill="none"/><g font-family="Georgia,serif" fill="#e1e7dc"><text x="58" y="62" font-size="13" letter-spacing="3">YASH / FIELD NOTES</text><text x="622" y="62" font-size="11" letter-spacing="2">02 / RETRIEVAL-AUGMENTED GENERATION</text><rect x="105" y="150" width="350" height="68" rx="5" fill="#253e35" stroke="#70ad8c" stroke-width="1.5"/><text x="130" y="192" font-size="24" >Question</text><path d="M280 225 v32 l-6 -8 m6 8 l6 -8" fill="none" stroke="#8fba9f" stroke-width="2"/><rect x="105" y="265" width="350" height="68" rx="5" fill="#253e35" stroke="#70ad8c" stroke-width="1.5"/><text x="130" y="307" font-size="24" >Retrieve passages</text><path d="M280 340 v32 l-6 -8 m6 8 l6 -8" fill="none" stroke="#8fba9f" stroke-width="2"/><rect x="105" y="380" width="350" height="68" rx="5" fill="#253e35" stroke="#70ad8c" stroke-width="1.5"/><text x="130" y="422" font-size="24" >Generate with context</text><text x="75" y="584" font-size="21" font-style="italic" fill="#a3b89a">Retrieve evidence before composing an answer.</text><text x="622" y="127" font-size="32" >Give the model a library</text><text x="622" y="187" font-size="22" >Ask a model about an internal document</text><text x="622" y="221" font-size="22" >it has never seen. Fluency will not help.</text><text x="622" y="255" font-size="22" ></text><text x="622" y="289" font-size="22" >RAG retrieves relevant passages and</text><text x="622" y="323" font-size="22" >puts them within reach of the generator.</text><text x="622" y="357" font-size="22" >The answer can then use that evidence.</text><text x="622" y="391" font-size="22" ></text><text x="622" y="425" font-size="22" >Bad retrieval still produces bad context.</text><text x="622" y="459" font-size="22" >Check the passages, then the answer.</text><path d="M624 494 Q820 484 1040 497" stroke="#75895c" fill="none"/><text x="622" y="541" font-size="18" font-style="italic" fill="#b4c9a4">A citation is useful only if it supports the claim.</text><text x="622" y="582" font-size="12" letter-spacing="2">CONCEPT NOTES · SEPTEMBER 2026</text><text x="58" y="639" font-size="15" >03</text><text x="1035" y="639" font-size="15" >04</text></g></svg>